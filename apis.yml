name: Quantum Metric
description: >-
  Quantum Metric is a continuous product design and digital experience
  intelligence platform that captures and quantifies every user session across
  web and mobile, replaying interactions and surfacing friction, errors, and
  conversion opportunities in real time so that product, engineering, and
  customer-experience teams can prioritize work by quantified business impact.
  The platform exposes data-export and integration APIs to customers within
  their authenticated instance; during enrichment no public, unauthenticated
  developer portal or OpenAPI definition was discoverable
  (developer.quantummetric.com and docs.quantummetric.com redirect to the
  marketing site and the help center returns a maintenance page).
